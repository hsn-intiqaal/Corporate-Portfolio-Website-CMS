# Self-managed server stack: website + CMS, PostgreSQL, Caddy (automatic HTTPS) and nightly backups.
# Usage (on the server, from the repository root):
#   cp .env.example .env   # fill in the values, set DOMAIN
#   docker compose -f deploy/docker-compose.yml up -d --build
name: corporate-site

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d cms']
      interval: 10s
      retries: 10

  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SERVER_URL: https://${DOMAIN:?set DOMAIN in .env}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD}@db:5432/cms
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
      SITE_ENV: ${SITE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Only used when S3 storage is not configured.
      - media:/app/media
      - lead-files:/app/lead-files

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

  backup:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../backups:/backups
      - media:/media:ro
    entrypoint: ['/bin/sh', '-c', 'while true; do /bin/sh /backup.sh; sleep 86400; done']
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  media:
  lead-files:
  caddy-data:
  caddy-config:
